<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>EPS-TOPIK Go</title>
    <script>try{if(localStorage.getItem("eps-dark")==="1")document.documentElement.classList.add("splash-dark")}catch(e){}</script>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fafafa;color:#27272a;font-family:system-ui,sans-serif;transition:opacity .25s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .logo{width:92px;height:92px;border-radius:26px;box-shadow:0 12px 32px rgba(67,56,202,.38);animation:splash-pop 1.6s ease-in-out infinite}
      #splash .logo svg{display:block;width:100%;height:100%}
      #splash .name{font-size:18px;font-weight:700;letter-spacing:.02em}
      #splash .dots{display:flex;gap:8px}
      #splash .dots i{width:9px;height:9px;border-radius:50%;background:#4338ca;animation:splash-dot 1.1s ease-in-out infinite}
      #splash .dots i:nth-child(2){animation-delay:.15s}
      #splash .dots i:nth-child(3){animation-delay:.3s}
      @keyframes splash-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes splash-dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-9px);opacity:1}}
      html.splash-dark #splash{background:#09090b;color:#f4f4f5}html.splash-dark #splash .logo{box-shadow:0 12px 32px rgba(99,102,241,.35)}html.splash-dark #splash .dots i{background:#818cf8}
      @media (prefers-reduced-motion:reduce){#splash .logo,#splash .dots i{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="EPS-TOPIK Go">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 100 100"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient><radialGradient id="sh" cx=".25" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="100" height="100" rx="24" fill="url(#sg)"/><rect width="100" height="100" rx="24" fill="url(#sh)"/><path d="M40.9 36.9C33.0 36.9 27.4 41.3 27.4 47.5C27.4 53.8 33.0 58.1 40.9 58.1C48.8 58.1 54.4 53.8 54.4 47.5C54.4 41.3 48.8 36.9 40.9 36.9ZM40.9 42.9C44.4 42.9 46.8 44.5 46.8 47.5C46.8 50.5 44.4 52.1 40.9 52.1C37.4 52.1 35.0 50.5 35.0 47.5C35.0 44.5 37.4 42.9 40.9 42.9ZM60.0 23.1V64.1H67.9V46.3H75.2V39.8H67.9V23.1ZM37.0 23.0V28.8H24.8V35.0H57.0V28.8H44.8V23.0ZM32.5 61.0V77.0H69.9V70.7H40.5V61.0Z" fill="#fff"/></svg>
      </div>
      <div class="name">EPS-TOPIK Go</div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
